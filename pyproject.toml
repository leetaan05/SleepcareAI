[project]
name = "sleepcare-web"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.117.1",
    "uvicorn==0.37.0",
    "numpy==2.2.6; python_version < '3.14'",
    "numpy>=2.2.6; python_version >= '3.14'",
    "onnxruntime==1.22.1; python_version < '3.14'",
    "onnxruntime>=1.24.0; python_version >= '3.14'",
    "torch==2.6.0+cpu; python_version < '3.14'",
    "torch>=2.6.0; python_version >= '3.14'",
    "transformers==5.20.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
